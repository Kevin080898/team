<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e3e2dd;--acc:#1f5fbf;--acc-bg:#e8f0fc;--ok:#1d7a3e;--ok-bg:#e7f5ec;--warn:#8a5a00;--warn-bg:#fff4dc;--bad:#b3261e;--bad-bg:#fdecea;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:18px}
header .t span{font-size:13px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:14px;font-family:inherit;color:var(--muted);min-height:34px}
.lang button.on{background:var(--ink);color:#fff}
main{padding:14px 14px 96px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-weight:600;font-size:12px;font-family:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
nav .dot{position:absolute;top:4px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h2{margin:0 0 10px;font-size:17px}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12.5px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font-weight:600;font-size:17px;font-family:inherit;min-height:54px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;color:var(--acc);padding:10px;min-height:0;font-weight:600}
.btn:disabled{opacity:.55}
.btn .sub{display:block;font-weight:400;font-size:14px;opacity:.9;margin-top:2px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cfcdc6;border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
textarea{min-height:110px;resize:vertical}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;font-family:inherit;min-height:42px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ok-box{background:var(--ok-bg);border-color:#bfe3cb}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.bad{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.info{background:var(--acc-bg);color:#123f80;border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.task{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0;padding-top:0}
.bar{width:6px;border-radius:6px;flex:none}
.p1{background:var(--bad)}.p2{background:#e0a100}.p3{background:#b9b7b0}
.badge{display:inline-block;font-weight:700;font-size:11.5px;font-family:inherit;border-radius:6px;padding:2px 7px;vertical-align:middle;margin-right:6px}
.b-neu{background:var(--acc);color:#fff}.b-p1{background:var(--bad-bg);color:var(--bad)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.einsatz{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fbfbfa}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-top:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:12px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.day{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:none}
td.n,th.n{text-align:right;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
#load{position:fixed;inset:0;background:rgba(244,244,241,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:30;font-weight:600}
#load.on{display:flex}
.spin{width:36px;height:36px;border:4px solid #cfcdc6;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.mic{display:flex;align-items:center;justify-content:center;gap:8px}
.mic.rec{background:var(--bad)!important;color:#fff!important}
a{color:var(--acc)}
details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;margin-top:6px}
.hide{display:none!important}
.seg{display:flex;background:#e9e8e3;border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;font:inherit;font-weight:600;font-size:15px;color:var(--muted);min-height:44px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mnav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.mnav b{flex:1;text-align:center;font-size:18px}
.mnav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:52px;min-height:48px;font-size:22px;font-family:inherit;color:var(--ink)}
.mnav button:disabled{opacity:.3}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpi div{background:#f7f7f4;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:11.5px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e4e3de;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px;line-height:1.25;padding:14px 5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .tag{position:absolute;top:4px;left:4px;background:var(--bad);color:#fff;border-radius:6px;font-size:10.5px;font-weight:700;padding:1px 5px}
.site{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:13px 2px;font:inherit;text-align:left;color:var(--ink);min-height:52px}
.site:first-of-type{border-top:0}
.site .n{background:var(--acc-bg);color:#123f80;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;white-space:nowrap}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:#fff}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:74vh;border-radius:8px;object-fit:contain}
#viewer .txt{margin-top:10px;font-size:14.5px;text-align:center;max-width:640px}
#viewer button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;border:0;border-radius:999px;width:44px;height:44px;background:rgba(255,255,255,.2);color:#fff;font-size:24px}
.dayh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
#qbar{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:15;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14.5px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:620px;margin:0 auto}
#qbar.fehler{background:var(--bad)}
#qbar .bar2{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;min-width:60px}
#qbar .bar2 i{display:block;height:100%;background:#fff;width:0;transition:width .2s}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .card{max-width:460px;width:100%;margin:0}
.vgl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.vgl>div{background:#f7f7f4;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13.5px}
.vgl b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.vgl .neu{background:var(--acc-bg);border-color:#c9daf5}
.pflicht{border:2px solid var(--warn);border-radius:12px;padding:10px;margin-top:10px;background:var(--warn-bg)}
.pflicht.ok{border-color:#bfe3cb;background:var(--ok-bg)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px}
.chk input{width:24px;height:24px;min-height:0;flex:none;margin-top:2px}
.qitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qitem img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#ddd}
.qitem .x{flex:1;min-width:0;font-size:14px}
</style>
</head>

const TOKEN = API_URL ? linkSchluessel() : '';
function linkSchluessel() {
  let k = new URLSearchParams(location.hash.replace(/^#/, '')).get('k') || new URLSearchParams(location.search).get('k') || '';
  try { if (k) localStorage.setItem('teamapp_k', k); else k = localStorage.getItem('teamapp_k') || ''; } catch (e) { }
  // Schlüssel zusätzlich als ?k= in die Adresse schreiben: „Zum Home-Bildschirm“ übernimmt die Adresse sicher mit,

  return k;
}
// Link nachträglich einfügen (z. B. in der Startbildschirm-App, die keine Adresszeile hat)

  const ok = () => {
    const v = String(inp.value || '').trim();
    const m = v.match(/[?#&]k=([0-9a-fA-F-]{20,})/) || v.match(/^([0-9a-fA-F-]{20,})$/);
    if (!m) { toast('Link nicht erkannt / Linkul nu a fost recunoscut'); return; }
    try { localStorage.setItem('teamapp_k', m[1]); localStorage.removeItem('teamapp_stand'); } catch (e) { }
    location.replace(location.pathname + '?k=' + encodeURIComponent(m[1]) + '#k=' + encodeURIComponent(m[1]));
    setTimeout(() => location.reload(), 50);
  };
  return h('div', { class: 'card' },
    h('h2', {}, 'Persönlichen Link einfügen / Lipește linkul personal'),
    h('div', { class: 'small' }, 'Kopiere deinen persönlichen Link aus der Nachricht von Kevin, füge ihn hier ein und tippe auf „Öffnen“. Danach merkt sich die App den Link. / Copiază linkul tău personal din mesajul de la Kevin, lipește-l aici și apasă „Deschide”. Aplicația îl reține după aceea.'),
    inp, h('button', { class: 'btn pri', id: 'btnLink', style: 'margin-top:10px', onclick: ok }, 'Öffnen / Deschide'));
}
function senden(aktion, daten) {
  if (API_URL) {
    // Kein Ladekreis für immer: Zeitlimit je Aufruf; reine Abfragen werden bei einem Netzfehler einmal wiederholt.
    const lesen = ['init', 'monat', 'fotos', 'vorschau', 'bild', 'admin'].indexOf(aktion) >= 0;
    const einmal = () => {
      const ac = window.AbortController ? new AbortController() : null;
      const to = setTimeout(() => ac && ac.abort(), aktion === 'auswerten' ? 70000 : 45000);
      return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow', signal: ac ? ac.signal : undefined,
        body: JSON.stringify({ token: TOKEN, aktion: aktion, daten: daten || {} }) }).then(r => r.json()).finally(() => clearTimeout(to));
    };
    return einmal().catch(e => lesen ? new Promise(r => setTimeout(r, 1200)).then(einmal) : Promise.reject(e))
      .catch(() => { throw new Error(t('netz')); });
  }
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(TOKEN, aktion, daten || {}));

const KUNDE = 'Kundenauftrag', SONST = 'Sonstiges';

let RB = { monat: null, ma: null, data: null, laedt: false, fehler: '' }, FOT = { modus: 'hoch', gruppen: null, objekt: null, liste: null, laedt: false, fehler: '' };

async function holeVorschau() {
  if (holeVorschau.laeuft || !WARTE.length) return;
  holeVorschau.laeuft = true;
  try {
    while (WARTE.length) {
      let ids = WARTE.splice(0, 12).filter(id => THUMB[id] === undefined);
      if (!ids.length) continue;
      const lokal = await Promise.all(ids.map(id => DB.get('img', id)));
      ids.forEach((id, i) => { if (lokal[i]) { THUMB[id] = lokal[i]; document.querySelectorAll('.ph[data-fid="' + id + '"]').forEach(b => fuelleKachel(b, id)); } });
      ids = ids.filter((id, i) => !lokal[i]);
      if (!ids.length) continue;
      let r;
      try { r = await call('vorschau', { ids }); } catch (e) { WARTE.length = 0; break; }   // Netzfehler: beim nächsten Anzeigen erneut
      const offen = [];
      ids.forEach(id => {
        if (r[id] === undefined) { offen.push(id); return; }   // vom Server noch nicht nachgeholt
        THUMB[id] = r[id] || '';
        if (r[id]) DB.put('img', r[id], id);
        document.querySelectorAll('.ph[data-fid="' + id + '"]').forEach(b => fuelleKachel(b, id));
      });
      if (offen.length && offen.length < ids.length) WARTE.unshift(...offen);
    }

}

      d && d.originaltext ? h('details', {}, h('summary', {}, t('deinText')), h('div', { class: 'small', style: 'white-space:pre-wrap' }, d.originaltext)) : null,
      fs.length ? h('div', { class: 'gal' }, fs.map(f => fotoKachel(f, false))) : null,
      antrag ? h('div', { class: antrag.status === 'beantragt' ? 'info' : 'bad', style: 'margin:6px 0' }, (antrag.status === 'beantragt' ? '📨 ' + t('beantragt') : '✕ ' + t('abgelehnt')) +

/* ======================== Verwaltung (Kevin) ======================== */
const HDE = c => (A.hinweisTexte && A.hinweisTexte[c]) || c;
const prioTxt = p => ({ 1: 'Wichtig', 2: 'Normal', 3: 'Wenn Zeit ist' })[p] || 'Normal';
async function neuLaden(msg) { laden(true, 'Aktualisiere …'); try { A = await call('admin'); S = await call('init'); RB.data = null; cacheWeg('monat'); laden(false); if (msg) toast(msg); zeichne(); } catch (e) { fehler(e); } }

/* ---------- Kevin: geänderte Einträge und Änderungsanträge ---------- */
function pruefAnzahl() { const P = A && A.pruefen; return P ? P.antraege.length + P.aenderungen.length : 0; }
function pruefHinweis() {
  const n = pruefAnzahl(); if (!n) return;

  try { if (sessionStorage.getItem('teamapp_pruef') === sig) return; sessionStorage.setItem('teamapp_pruef', sig); } catch (e) { }

  m.replaceChildren(h('div', { class: 'card' }, h('h2', {}, '⚠ Zu prüfen: ' + n),
    A.pruefen.antraege.length ? h('div', {}, '📨 ' + (A.pruefen.antraege.length === 1 ? '1 Änderungsantrag' : A.pruefen.antraege.length + ' Änderungsanträge') + ' – zählt erst nach deiner Entscheidung') : null,
    A.pruefen.aenderungen.length ? h('div', {}, '✎ ' + (A.pruefen.aenderungen.length === 1 ? '1 Eintrag wurde' : A.pruefen.aenderungen.length + ' Einträge wurden') + ' nach der ersten Erfassung geändert') : null,
    h('button', { class: 'btn pri', id: 'btnPruefen', style: 'margin-top:12px', onclick: () => { m.classList.remove('on'); TAB = 'team'; ADM_RB = null; EDIT = null; zeichne(); const k = document.getElementById('pruefKarte'); if (k) k.scrollIntoView(); } }, 'Jetzt ansehen'),
    h('button', { class: 'btn link', onclick: () => m.classList.remove('on') }, 'Später')));

}
function tagText(d) {
  if (!d) return [h('div', { class: 'muted' }, '– kein Eintrag –')];
  return [h('div', {}, d.art === 'Arbeit' ? d.beginn + '–' + d.ende + ', ' + d.pause + ' Min. Pause' : d.art),
    d.art === 'Arbeit' ? h('div', {}, h('b', { style: 'display:inline;font-size:inherit;color:inherit' }, zahl(d.arbeitszeit) + ' Std.')) : null,
    (d.einsaetze || []).map(e => h('div', {}, objLabel(e.objekt, true) + (e.kundenadresse ? ' (' + e.kundenadresse + ')' : '') + ': ' + zahl(e.stunden))),
    d.erfasstAm ? h('div', { class: 'xs muted' }, 'erfasst ' + dDe(d.erfasstAm) + (d.quelle ? ' · ' + d.quelle : '')) : null];
}
function pruefKarte() {
  const P = A.pruefen; if (!pruefAnzahl()) return null;
  const card = h('div', { class: 'card', id: 'pruefKarte', style: 'border:2px solid var(--warn)' }, h('h2', {}, '⚠ Zu prüfen (' + pruefAnzahl() + ')'));
  const entscheiden = async (id, was) => { laden(true, '…'); try { await call('antrag', { tagId: id, entscheidung: was }); await neuLaden(was === 'ok' ? 'Übernommen' : 'Abgelehnt'); } catch (e) { fehler(e); } };
  P.antraege.forEach(a => {
    const nein = h('button', { class: 'btn sec', style: 'min-height:44px;padding:10px', onclick: () => {
      if (nein.dataset.sicher) entscheiden(a.tagId, 'nein'); else { nein.dataset.sicher = '1'; nein.textContent = 'Wirklich ablehnen?'; } } }, 'Ablehnen');
    card.append(h('div', { class: 'einsatz' },
      h('b', {}, '📨 Antrag · ' + a.name + ' · ' + dKurz(a.datum)),
      h('div', { class: 'small' }, 'Grund: ' + (a.grund || '–')),
      h('div', { class: 'vgl' }, h('div', {}, h('b', {}, 'Bisher gültig'), tagText(a.bisher)), h('div', { class: 'neu' }, h('b', {}, 'Beantragt'), tagText(a.neu))),
      hinweisBoxDe(a.neu && a.neu.hinweise),
      h('div', { class: 'row' }, h('button', { class: 'btn ok', style: 'min-height:44px;padding:10px', onclick: () => entscheiden(a.tagId, 'ok') }, 'Übernehmen'), nein)));
  });
  P.aenderungen.forEach(a => card.append(h('div', { class: 'einsatz' },
    h('b', {}, '✎ Geändert · ' + a.name + ' · ' + dKurz(a.datum)),
    h('div', { class: 'vgl' }, h('div', {}, h('b', {}, 'Zuerst erfasst'), tagText(a.bisher)), h('div', { class: 'neu' }, h('b', {}, 'Jetzt'), tagText(a.neu))),
    hinweisBoxDe(a.neu && a.neu.hinweise),
    h('button', { class: 'btn sec', style: 'min-height:44px;padding:10px', onclick: async () => { laden(true, '…'); try { await call('gesehen', { tagId: a.tagId }); await neuLaden(); } catch (e) { fehler(e); } } }, '✓ Gesehen'))));
  if (P.aenderungen.length > 1) card.append(h('button', { class: 'btn link', onclick: async () => { laden(true, '…'); try { await call('gesehen', { alle: true }); await neuLaden(); } catch (e) { fehler(e); } } }, 'Alle Änderungen als gesehen markieren'));
  return card;
}
const hinweisBoxDe = codes => (codes || []).filter(c => c && c !== 'ZUKUNFT').length ? h('div', { class: 'warn' }, codes.filter(c => c !== 'ZUKUNFT').map(c => h('div', {}, '⚠ ' + HDE(c)))) : null;
function aTeam(v) {
  if (ADM_RB) {

  A.mitarbeiter.filter(m => m.rolle !== 'Admin').forEach(m => {

        h('span', { class: 'badge ' + (m.heute ? 'b-ok' : 'b-warn') }, m.heute ? 'heute erfasst' : 'heute offen')),

        h('button', { class: 'btn sec', style: 'min-height:44px;padding:10px', onclick: async () => { try { await navigator.clipboard.writeText(m.link); toast('Link kopiert'); } catch (e) { linkFeld.select(); toast('Link markiert – jetzt kopieren'); } } }, 'Link kopieren'),
        h('button', { class: 'btn sec', style: 'min-height:44px;padding:10px', onclick: () => { ADM_RB = m.id; zeichne(); window.scrollTo(0, 0); } }, 'Rückblick'))));
  });
  v.append(h('div', { class: 'card' }, h('h2', {}, 'Einträge der letzten 3 Wochen'),
    A.tage.length ? A.tage.map(d => h('div', { class: 'day' },
      h('div', { style: 'min-width:0' }, h('b', {}, dKurz(d.datum) + ' · ' + d.name),
        h('div', { class: 'small muted' }, d.art !== 'Arbeit' ? d.art : d.einsaetze.map(e => objLabel(e.objekt, true) + (e.kundenadresse ? ' (' + e.kundenadresse + ')' : '') + ': ' + zahl(e.stunden) + ' Std.' + (e.taetigkeit ? ' – ' + e.taetigkeit : '')).join(' · ')),
        d.hinweise.length ? h('div', { class: 'xs', style: 'color:var(--warn)' }, '⚠ ' + d.hinweise.map(HDE).join('; ')) : null,
        d.originaltext ? h('details', {}, h('summary', {}, 'Originaltext (' + d.quelle + ')'), h('div', { class: 'small' }, d.originaltext)) : h('div', { class: 'xs muted' }, d.quelle + ' · erfasst ' + dDe(d.erfasstAm))),
      h('div', { style: 'text-align:right;white-space:nowrap' }, d.art === 'Arbeit' ? [h('b', {}, zahl(d.arbeitszeit) + ' Std.'), h('div', { class: 'xs muted' }, d.beginn + '–' + d.ende + ', ' + d.pause + ' Min.')] : ''))) : h('div', { class: 'muted' }, 'Noch keine Einträge.')));
  if (inst) v.append(inst);
}

function aAufgaben(v) {
  const F = aAufgaben.f = aAufgaben.f || { fuer: 'ALLE', objekt: '', prio: 2, faellig: '', titel: '', beschreibung: '' };
  const ma = A.mitarbeiter.filter(m => m.rolle !== 'Admin');
  v.append(h('div', { class: 'card' }, h('h2', {}, 'Neue Aufgabe'),
    h('label', {}, 'Für'), h('select', { onchange: ev => F.fuer = ev.target.value }, [h('option', { value: 'ALLE', selected: F.fuer === 'ALLE' }, 'Alle Mitarbeiter')].concat(ma.map(m => h('option', { value: m.id, selected: F.fuer === m.id }, m.name)))),
    h('label', {}, 'Titel'), h('input', { value: F.titel, placeholder: 'z. B. Silikonfugen Bad 2. OG erneuern', oninput: ev => F.titel = ev.target.value }),
    h('label', {}, 'Beschreibung (optional)'), h('textarea', { placeholder: 'Details, Material, Ansprechpartner …', oninput: ev => F.beschreibung = ev.target.value }, F.beschreibung),
    h('div', { class: 'row' },
      h('div', {}, h('label', {}, 'Objekt'), h('select', { onchange: ev => F.objekt = ev.target.value }, [h('option', { value: '' }, '–')].concat(A.objekte.map(o => h('option', { value: o, selected: F.objekt === o }, objLabel(o)))))),
      h('div', {}, h('label', {}, 'Fällig'), h('input', { type: 'date', value: F.faellig, oninput: ev => F.faellig = ev.target.value }))),
    h('label', {}, 'Priorität'), h('div', { class: 'chips' }, [1, 2, 3].map(p => h('button', { class: 'chip' + (F.prio === p ? ' on' : ''), onclick: () => { F.prio = p; zeichne(); } }, prioTxt(p)))),
    h('div', { class: 'xs muted', style: 'margin-top:8px' }, 'Für rumänischsprachige Mitarbeiter wird die Aufgabe automatisch übersetzt. Sie erscheint sofort in der App, ganz oben bei „Wichtig“.'),
    h('button', { class: 'btn pri', style: 'margin-top:12px', onclick: async () => {
      if (!F.titel.trim()) { toast('Titel fehlt'); return; }
      laden(true, 'Speichere Aufgabe …');
      try { const r = await call('aufgabeNeu', F); aAufgaben.f = null; await neuLaden(r.brauchtRo && !r.uebersetzt ? 'Gespeichert – Übersetzung fehlgeschlagen, deutsch angezeigt' : 'Aufgabe gespeichert'); } catch (e) { fehler(e); }
    } }, 'Aufgabe speichern')));
  const liste = h('div', { class: 'card' }, h('h2', {}, 'Aufgaben'));
  if (!A.aufgaben.length) liste.append(h('div', { class: 'muted' }, 'Keine Aufgaben.'));
  A.aufgaben.forEach(a => liste.append(h('div', { class: 'task' }, h('div', { class: 'bar p' + a.prio }),
    h('div', { style: 'flex:1;min-width:0' },
      h('div', {}, h('span', { class: 'badge ' + (a.status === 'erledigt' ? 'b-ok' : 'b-warn') }, a.status), h('b', {}, a.titel)),
      h('div', { class: 'small muted' }, ['für ' + a.fuerName, a.objekt ? objLabel(a.objekt) : '', a.faellig ? 'bis ' + dDe(a.faellig) : '', prioTxt(a.prio)].filter(Boolean).join(' · ')),
      a.beschreibung ? h('div', { class: 'small', style: 'white-space:pre-wrap' }, a.beschreibung) : null,
      a.status === 'erledigt' ? h('div', { class: 'small', style: 'color:var(--ok)' }, '✓ ' + dDe(a.erledigtAm) + ' von ' + (a.erledigtVon || '') + (a.rueckmeldung ? ': ' + a.rueckmeldung : '')) : null,
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { class: 'btn sec', style: 'min-height:40px;padding:8px;font-size:15px', onclick: () => status(a.id, a.status === 'offen' ? 'erledigt' : 'offen') }, a.status === 'offen' ? 'Als erledigt markieren' : 'Wieder öffnen'),
        h('button', { class: 'btn sec', style: 'min-height:40px;padding:8px;font-size:15px', onclick: () => status(a.id, 'archiviert') }, 'Archivieren'))))));
  v.append(liste);
  async function status(id, s) { laden(true, '…'); try { await call('aufgabeStatus', { id, status: s }); await neuLaden(); } catch (e) { fehler(e); } }
}

function aKunden(v) {
  const card = h('div', { class: 'card' }, h('h2', {}, 'Kundenaufträge'), h('div', { class: 'xs muted' }, 'Entstehen automatisch, wenn ein Mitarbeiter eine fremde Adresse nennt. Zuordnen, dann abrechnen.'));
  if (!A.kunden.length) card.append(h('div', { class: 'muted', style: 'margin-top:10px' }, 'Noch keine Kundenaufträge.'));

    const ku = h('input', { value: k.kunde || '', placeholder: 'Kunde / Auftraggeber' });

    card.append(h('div', { class: 'einsatz' }, h('b', {}, k.adresse),
      h('div', { class: 'small muted' }, 'seit ' + dDe(k.erstmals) + ' · ' + k.mitarbeiter + ' · ' + zahl(k.stunden) + ' Std. erfasst'),
      h('label', {}, 'Status'), st, h('label', {}, 'Kunde'), ku, h('label', {}, 'Notiz'), no,
      h('button', { class: 'btn sec', style: 'margin-top:8px;min-height:44px;padding:10px', onclick: async () => { laden(true, '…'); try { await call('kundenauftrag', { id: k.id, status: st.value, kunde: ku.value, notiz: no.value }); await neuLaden('Gespeichert'); } catch (e) { fehler(e); } } }, 'Speichern')));

function aDateien(v) {
  galerie(v);
  if (FOT.objekt) return;
  v.append(h('div', { class: 'card' }, h('h2', {}, 'Letzte Fotos und Belege'),
    h('div', { class: 'xs muted' }, 'Fotos liegen im Import-Ordner des Objekts (nächtliche Verarbeitung U-07), Belege im 00_Eingang (Ablage U-02).'),
    A.dateien.length ? A.dateien.map(f => h('div', { class: 'day' },
      h('div', { style: 'min-width:0' }, h('b', {}, f.art + ' · ' + objLabel(f.objekt)), h('div', { class: 'small muted' }, dDe(f.zeit) + ' · ' + f.name + (f.notiz ? ' · ' + f.notiz : ''))),
      h('a', { href: f.link, target: '_blank', rel: 'noopener' }, 'Öffnen'))) : h('div', { class: 'muted', style: 'margin-top:10px' }, 'Noch keine Dateien.')));
}

function aStunden(v) {
  const SATZ = 35, SG_MAX = 4499.84;
  [A.monat, A.vormonat].forEach(mon => {
    const zeilen = A.stunden.filter(z => z.monat === mon);
    const card = h('div', { class: 'card' }, h('h2', {}, 'Stunden ' + mon.slice(5) + '/' + mon.slice(0, 4)));
    if (!zeilen.length) { card.append(h('div', { class: 'muted' }, 'Keine Stunden.')); v.append(card); return; }
    const ges = {};
    zeilen.forEach(z => { (ges[z.gesellschaft] = ges[z.gesellschaft] || []).push(z); });
    const tab = h('table', {}, h('tr', {}, h('th', {}, 'Objekt / Mitarbeiter'), h('th', { class: 'n' }, 'Std.'), h('th', { class: 'n' }, 'netto zu 35 €')));
    Object.keys(ges).sort().forEach(g => {
      const sum = ges[g].reduce((s, z) => s + z.stunden, 0);
      tab.append(h('tr', {}, h('td', {}, h('b', {}, g)), h('td', { class: 'n' }, h('b', {}, zahl(sum))), h('td', { class: 'n' }, h('b', {}, (sum * SATZ).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' })))));
      ges[g].forEach(z => tab.append(h('tr', {}, h('td', { class: 'small' }, objLabel(z.objekt) + ' · ' + z.name), h('td', { class: 'n small' }, zahl(z.stunden)), h('td', {}))));
      if (g === 'SG Beteiligungs' && sum * SATZ > SG_MAX) tab.append(h('tr', {}, h('td', { colspan: 3 }, h('div', { class: 'warn' }, 'SG-Obergrenze 4.499,84 € netto überschritten – ' + zahl(sum - SG_MAX / SATZ) + ' Std. auf andere Objekte verteilen.'))));
    });
    card.append(tab, h('div', { class: 'xs muted', style: 'margin-top:8px' }, 'Verrechnungssatz 35,00 € netto je produktive Stunde (Kalkulation 10_Personal). Kundenaufträge werden separat abgerechnet.'));
    v.append(card);
  });
}
