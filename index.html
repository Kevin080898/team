<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Immoselect">

<title>Immoselect Team</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e3e2dd;--acc:#1f5fbf;--acc-bg:#e8f0fc;--ok:#1d7a3e;--ok-bg:#e7f5ec;--warn:#8a5a00;--warn-bg:#fff4dc;--bad:#b3261e;--bad-bg:#fdecea;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:18px}
header .t span{font-size:13px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:14px;font-family:inherit;color:var(--muted);min-height:34px}
.lang button.on{background:var(--ink);color:#fff}
main{padding:14px 14px 96px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-weight:600;font-size:12px;font-family:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
nav .dot{position:absolute;top:4px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h2{margin:0 0 10px;font-size:17px}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12.5px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font-weight:600;font-size:17px;font-family:inherit;min-height:54px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;color:var(--acc);padding:10px;min-height:0;font-weight:600}
.btn:disabled{opacity:.55}
.btn .sub{display:block;font-weight:400;font-size:14px;opacity:.9;margin-top:2px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cfcdc6;border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
textarea{min-height:110px;resize:vertical}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;font-family:inherit;min-height:42px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ok-box{background:var(--ok-bg);border-color:#bfe3cb}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.bad{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.info{background:var(--acc-bg);color:#123f80;border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.task{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0;padding-top:0}
.bar{width:6px;border-radius:6px;flex:none}
.p1{background:var(--bad)}.p2{background:#e0a100}.p3{background:#b9b7b0}
.badge{display:inline-block;font-weight:700;font-size:11.5px;font-family:inherit;border-radius:6px;padding:2px 7px;vertical-align:middle;margin-right:6px}
.b-neu{background:var(--acc);color:#fff}.b-p1{background:var(--bad-bg);color:var(--bad)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.einsatz{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fbfbfa}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-top:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:12px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.day{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:none}
td.n,th.n{text-align:right;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
#load{position:fixed;inset:0;background:rgba(244,244,241,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:30;font-weight:600}
#load.on{display:flex}
.spin{width:36px;height:36px;border:4px solid #cfcdc6;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.mic{display:flex;align-items:center;justify-content:center;gap:8px}
.mic.rec{background:var(--bad)!important;color:#fff!important}
a{color:var(--acc)}
details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;margin-top:6px}
.hide{display:none!important}
.seg{display:flex;background:#e9e8e3;border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;font:inherit;font-weight:600;font-size:15px;color:var(--muted);min-height:44px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mnav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.mnav b{flex:1;text-align:center;font-size:18px}
.mnav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:52px;min-height:48px;font-size:22px;font-family:inherit;color:var(--ink)}
.mnav button:disabled{opacity:.3}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpi div{background:#f7f7f4;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:11.5px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e4e3de;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px;line-height:1.25;padding:14px 5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .tag{position:absolute;top:4px;left:4px;background:var(--bad);color:#fff;border-radius:6px;font-size:10.5px;font-weight:700;padding:1px 5px}
.site{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:13px 2px;font:inherit;text-align:left;color:var(--ink);min-height:52px}
.site:first-of-type{border-top:0}
.site .n{background:var(--acc-bg);color:#123f80;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;white-space:nowrap}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:#fff}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:74vh;border-radius:8px;object-fit:contain}
#viewer .txt{margin-top:10px;font-size:14.5px;text-align:center;max-width:640px}
#viewer button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;border:0;border-radius:999px;width:44px;height:44px;background:rgba(255,255,255,.2);color:#fff;font-size:24px}
.dayh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
</style>
</head>

}

// Kleines Vorschaubild (ca. 240 Pixel, meist 10–20 KB) für Rückblick und Baustellen-Ansicht; schlägt es fehl, wird ohne Vorschau hochgeladen.
function vorschauBild(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      try {
        let out = '';
        for (const max of [240, 180, 140]) {
          const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', 0.55).split(',')[1] || '';
          if (out.length <= 44000) break;
        }
        URL.revokeObjectURL(url); res(out.length <= 44000 ? out : '');
      } catch (e) { URL.revokeObjectURL(url); res(''); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(''); };
    img.src = url;
  });
}
function alsBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
function verkleinern(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ data: c.toDataURL('image/jpeg', q).split(',')[1], mime: 'image/jpeg' });
    };
    // Kann der Browser das Bild nicht lesen (z. B. HEIC auf Android): Original mit seinem eigenen Dateityp senden.
    img.onerror = () => { URL.revokeObjectURL(url); alsBase64(file).then(d => res({ data: d, mime: file.type || (/\.heic$/i.test(file.name) ? 'image/heic' : 'image/jpeg') }), rej); };
    img.src = url;
  });
}
